<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPD Estudio — 8086/8088</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1b2d;
    --surface:#16263d;
    --surface-2:#1c2f4a;
    --border:#2c435f;
    --grid:#1a2c46;
    --text:#e8eef5;
    --text-muted:#8ba3bf;
    --accent:#5ec8d8;
    --accent-soft:rgba(94,200,216,0.12);
    --amber:#f2b134;
    --amber-soft:rgba(242,177,52,0.14);
    --good:#6fcf7d;
    --good-soft:rgba(111,207,125,0.14);
    --bad:#e8695f;
    --bad-soft:rgba(232,105,95,0.14);
    --radius:8px;
    --font-mono:'IBM Plex Mono',monospace;
    --font-sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:34px 34px;
  }
  h1,h2,h3,.brand,.nav-item,code,.mono{font-family:var(--font-mono);}
  code{background:var(--surface-2);padding:1px 6px;border-radius:4px;font-size:0.92em;color:var(--accent);}

  #app{display:flex;min-height:100vh;}

  .sidebar{
    width:230px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:24px 0;
  }
  .brand{
    padding:0 22px 20px 22px;border-bottom:1px solid var(--border);margin-bottom:14px;
    font-size:21px;font-weight:600;letter-spacing:0.5px;
  }
  .brand .chip{
    display:inline-block;background:var(--accent-soft);color:var(--accent);
    font-size:11px;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:middle;
    letter-spacing:0.5px;
  }
  .brand-sub{display:block;font-family:var(--font-sans);font-size:12px;color:var(--text-muted);margin-top:4px;font-weight:400;}

  nav{display:flex;flex-direction:column;gap:2px;padding:0 12px;margin-bottom:8px;}
  .nav-section-label{font-size:11px;color:var(--text-muted);padding:12px 10px 4px 10px;letter-spacing:0.4px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;cursor:pointer;
    color:var(--text-muted);font-size:14px;font-weight:500;border:none;background:transparent;
    text-align:left;width:100%;font-family:var(--font-sans);
  }
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);}

  .main{flex:1;padding:36px 44px;max-width:920px;}
  .topbar{margin-bottom:26px;}
  .topbar h1{font-size:24px;margin:0 0 4px 0;font-weight:600;}
  .topbar .sub{color:var(--text-muted);font-size:13.5px;}

  /* --- Resumen --- */
  .unit-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
  .unit-head{
    padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-mono);font-size:15px;font-weight:600;
  }
  .unit-head:hover{background:var(--surface-2);}
  .unit-head .arrow{color:var(--accent);transition:transform 0.15s ease;font-size:13px;}
  .unit-head.open .arrow{transform:rotate(90deg);}
  .unit-body{padding:0 22px 22px 22px;display:none;font-size:14.5px;line-height:1.65;}
  .unit-body.open{display:block;}
  .unit-body h3{font-size:14px;color:var(--accent);margin:18px 0 8px 0;text-transform:none;}
  .unit-body ul{padding-left:20px;margin:8px 0;}
  .unit-body li{margin-bottom:6px;}
  .unit-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;}
  .unit-body th,.unit-body td{border:1px solid var(--border);padding:8px 10px;text-align:left;}
  .unit-body th{background:var(--surface-2);color:var(--accent);font-family:var(--font-mono);font-weight:500;}
  .img-row{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0;}
  .img-row figure{margin:0;flex:1;min-width:220px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:10px;}
  .img-row img{width:100%;display:block;border-radius:4px;background:#fff;}
  .img-row figcaption{font-size:12px;color:var(--text-muted);margin-top:8px;text-align:center;font-family:var(--font-sans);}

  .search-box{margin-bottom:18px;}
  .search-box input{
    width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:11px 14px;border-radius:7px;font-size:14px;font-family:var(--font-sans);
  }
  .search-box input:focus{outline:2px solid var(--accent);outline-offset:1px;}

  /* --- Práctica --- */
  .quiz-setup{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
  .quiz-setup h2{font-size:16px;margin:0 0 14px 0;}
  .chip-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .chip-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
    padding:7px 13px;border-radius:100px;font-size:13px;cursor:pointer;font-family:var(--font-sans);
  }
  .chip-btn.selected{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .btn{
    background:var(--accent);color:#08222a;border:none;border-radius:7px;padding:10px 18px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-sans);
  }
  .btn:hover{filter:brightness(1.1);}
  .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}

  .q-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--text-muted);font-size:13px;font-family:var(--font-mono);}
  .q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;}
  .q-tag{display:inline-block;background:var(--surface-2);color:var(--accent);font-size:11.5px;padding:3px 9px;border-radius:5px;margin-bottom:12px;font-family:var(--font-mono);}
  .q-text{font-size:17px;font-weight:500;margin-bottom:20px;line-height:1.5;}
  .opt-btn{
    display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);padding:13px 16px;border-radius:7px;font-size:14.5px;margin-bottom:9px;cursor:pointer;
    font-family:var(--font-sans);
  }
  .opt-btn:hover:not(.locked){border-color:var(--accent);}
  .opt-btn.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);}
  .opt-btn.incorrect{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}
  .opt-btn.missed{border-color:var(--amber);color:var(--amber);}
  .opt-btn.locked{cursor:default;}
  .opt-btn.checkbox{display:flex;align-items:center;gap:11px;}
  .opt-btn .chk{
    width:17px;height:17px;border:2px solid var(--text-muted);border-radius:4px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }
  .opt-btn.selected .chk{border-color:var(--accent);background:var(--accent);color:#08222a;}
  .opt-btn.correct .chk{border-color:var(--good);background:var(--good);color:#08220f;}
  .opt-btn.incorrect .chk{border-color:var(--bad);background:var(--bad);color:#2a0a08;}
  .opt-btn.missed .chk{border-color:var(--amber);background:transparent;}
  .multi-hint{font-size:12px;color:var(--text-muted);margin:-6px 0 14px 0;font-style:italic;}
  .explain{
    margin-top:16px;padding:14px 16px;background:var(--surface-2);border-left:3px solid var(--accent);
    border-radius:5px;font-size:13.5px;color:var(--text-muted);line-height:1.55;display:none;
  }
  .explain.show{display:block;}
  .q-actions{margin-top:20px;display:flex;justify-content:flex-end;}

  .score-screen{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;text-align:center;}
  .score-num{font-family:var(--font-mono);font-size:52px;font-weight:700;color:var(--accent);}
  .score-label{color:var(--text-muted);font-size:14px;margin-top:6px;}
  .score-detail{margin-top:22px;text-align:left;max-width:420px;margin-left:auto;margin-right:auto;}
  .score-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px;}

  ::placeholder{color:#5c7592;}

  @media (max-width: 760px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 16px;overflow-x:auto;}
    .brand{border-bottom:none;padding:0 16px 0 0;margin:0;border-right:1px solid var(--border);white-space:nowrap;}
    .brand-sub{display:none;}
    nav{flex-direction:row;padding:0 0 0 12px;}
    .nav-section-label{display:none;}
    .main{padding:20px;}
    .img-row{flex-direction:column;}
  }
</style>
</head>
<body>

<div id="app">
  <div class="sidebar">
    <div class="brand">SPD<span class="chip">8086/88</span>
      <span class="brand-sub">Sistemas de Procesamiento de Datos</span>
    </div>
    <nav id="nav"></nav>
  </div>
  <div class="main" id="main"></div>
</div>

<script src="./content.js"></script>
<script>
let currentView = 'resumen';
let openUnits = new Set();

// Estado de la práctica
let quizFilters = { parcial: 'todos', tema: 'todos' };
let quizPool = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswers = [];
let quizAnswered = false;

const NAV_ITEMS = [
  { id: 'resumen', label: 'Resumen teórico', group: 'Estudiar' },
  { id: 'practica-setup', label: 'Práctica', group: 'Estudiar' },
];

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  let lastGroup = null;
  NAV_ITEMS.forEach(item=>{
    if(item.group !== lastGroup){
      const label = document.createElement('div');
      label.className = 'nav-section-label';
      label.textContent = item.group;
      nav.appendChild(label);
      lastGroup = item.group;
    }
    const btn = document.createElement('button');
    const active = currentView === item.id || (item.id==='practica-setup' && currentView.startsWith('practica'));
    btn.className = 'nav-item' + (active ? ' active' : '');
    btn.textContent = item.label;
    btn.onclick = ()=>{ goTo(item.id); };
    nav.appendChild(btn);
  });
}

function goTo(view){
  currentView = view;
  if(view === 'practica-setup'){ resetQuizSetup(); }
  render();
}

function render(){
  renderNav();
  const main = document.getElementById('main');
  if(currentView === 'resumen') return renderResumen(main);
  if(currentView === 'practica-setup') return renderQuizSetup(main);
  if(currentView === 'practica-run') return renderQuizQuestion(main);
  if(currentView === 'practica-score') return renderQuizScore(main);
}

// ---------------- RESUMEN ----------------
function renderResumen(main){
  main.innerHTML = `
    <div class="topbar">
      <h1>Resumen teórico</h1>
      <div class="sub">Unidades 1 a 8 — hacé clic en cada una para expandirla.</div>
    </div>
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Buscar un término (ej: overflow, caché, IVT)...">
    </div>
    <div id="units-wrap"></div>
  `;
  document.getElementById('search-input').addEventListener('input', (e)=> filtrarResumen(e.target.value));
  pintarUnidades(RESUMEN);
}

function pintarUnidades(lista){
  const wrap = document.getElementById('units-wrap');
  wrap.innerHTML = '';
  if(lista.length === 0){
    wrap.innerHTML = `<div style="color:var(--text-muted);padding:20px;">No se encontraron resultados.</div>`;
    return;
  }
  lista.forEach(u=>{
    const card = document.createElement('div');
    card.className = 'unit-card';
    const isOpen = openUnits.has(u.id);
    card.innerHTML = `
      <div class="unit-head ${isOpen?'open':''}" data-id="${u.id}">
        <span>${u.titulo}</span><span class="arrow">▶</span>
      </div>
      <div class="unit-body ${isOpen?'open':''}">${u.html}</div>
    `;
    card.querySelector('.unit-head').onclick = ()=>{
      if(openUnits.has(u.id)) openUnits.delete(u.id); else openUnits.add(u.id);
      pintarUnidades(lista);
    };
    wrap.appendChild(card);
  });
}

function filtrarResumen(term){
  term = term.trim().toLowerCase();
  if(!term){ pintarUnidades(RESUMEN); return; }
  const filtrado = RESUMEN.filter(u => (u.titulo + ' ' + u.html).toLowerCase().includes(term));
  filtrado.forEach(u=> openUnits.add(u.id));
  pintarUnidades(filtrado);
}

// ---------------- PRACTICA: SETUP ----------------
function resetQuizSetup(){
  quizFilters = { parcial: 'todos', tema: 'todos', cantidad: 'todas' };
}

function temasDisponibles(){
  const temas = new Set(QUIZ.map(q=>q.tema));
  return ['todos', ...temas];
}

function renderQuizSetup(main){
  const temas = temasDisponibles();
  main.innerHTML = `
    <div class="topbar">
      <h1>Práctica</h1>
      <div class="sub">Preguntas basadas en el análisis de parciales reales, más preguntas
      generadas al azar (con números distintos cada vez) para los temas de cálculo.</div>
    </div>
    <div class="quiz-setup">
      <h2>¿Qué parcial querés practicar?</h2>
      <div class="chip-group" id="chip-parcial">
        ${['todos','1','2'].map(p=>`<button class="chip-btn ${quizFilters.parcial===p?'selected':''}" data-p="${p}">${p==='todos'?'Todos':'Parcial '+p}</button>`).join('')}
      </div>
      <h2>¿Algún tema en particular?</h2>
      <div class="chip-group" id="chip-tema">
        ${temas.map(t=>`<button class="chip-btn ${quizFilters.tema===t?'selected':''}" data-t="${t}">${t==='todos'?'Todos':t}</button>`).join('')}
      </div>
      <h2>¿Cuántas preguntas?</h2>
      <div class="chip-group" id="chip-cantidad">
        ${['10','20','todas'].map(c=>`<button class="chip-btn ${quizFilters.cantidad===c?'selected':''}" data-c="${c}">${c==='todas'?'Todas':c}</button>`).join('')}
      </div>
      <button class="btn" id="start-quiz">Empezar práctica</button>
    </div>
  `;
  document.querySelectorAll('#chip-parcial .chip-btn').forEach(b=>{
    b.onclick = ()=>{ quizFilters.parcial = b.dataset.p; renderQuizSetup(main); };
  });
  document.querySelectorAll('#chip-tema .chip-btn').forEach(b=>{
    b.onclick = ()=>{ quizFilters.tema = b.dataset.t; renderQuizSetup(main); };
  });
  document.querySelectorAll('#chip-cantidad .chip-btn').forEach(b=>{
    b.onclick = ()=>{ quizFilters.cantidad = b.dataset.c; renderQuizSetup(main); };
  });
  document.getElementById('start-quiz').onclick = ()=> iniciarQuiz();
}

function iniciarQuiz(){
  let pool = QUIZ.slice();
  if(quizFilters.parcial !== 'todos') pool = pool.filter(q=> String(q.parcial) === quizFilters.parcial);
  if(quizFilters.tema !== 'todos') pool = pool.filter(q=> q.tema === quizFilters.tema);

  // Sumar preguntas generadas al azar (números distintos en cada intento) para los
  // generadores cuyo tema/parcial coincida con el filtro elegido.
  const generadoresAplicables = GENERATORS.filter(g=>
    (quizFilters.parcial === 'todos' || String(g.parcial) === quizFilters.parcial) &&
    (quizFilters.tema === 'todos' || g.tema === quizFilters.tema)
  );
  generadoresAplicables.forEach(g=>{
    const cantidad = randInt(2, 4);
    for(let i=0; i<cantidad; i++) pool.push(g.fn());
  });

  if(pool.length === 0){ alert('No hay preguntas para esa combinación. Probá con otro filtro.'); return; }
  // Mezclar orden
  pool = pool.sort(()=> Math.random() - 0.5);
  // Recortar a la cantidad elegida (si no es "todas")
  if(quizFilters.cantidad !== 'todas'){
    const n = parseInt(quizFilters.cantidad, 10);
    if(pool.length > n) pool = pool.slice(0, n);
  }
  quizPool = pool;
  quizIndex = 0;
  quizScore = 0;
  quizAnswers = [];
  quizAnswered = false;
  currentView = 'practica-run';
  render();
}

// ---------------- PRACTICA: PREGUNTA ----------------
let quizSelected = new Set();

function renderQuizQuestion(main){
  const q = quizPool[quizIndex];
  quizSelected = new Set();
  main.innerHTML = `
    <div class="topbar">
      <h1>Práctica</h1>
    </div>
    <div class="q-progress">
      <span>Pregunta ${quizIndex+1} de ${quizPool.length}</span>
      <span>Puntaje: ${quizScore}/${quizIndex}</span>
    </div>
    <div class="q-card">
      <div class="q-tag">Parcial ${q.parcial} · ${q.tema}${q.multi ? ' · Selección múltiple' : ''}</div>
      <div class="q-text">${q.p}</div>
      ${q.multi ? `<div class="multi-hint">Marcá todas las opciones que correspondan y después confirmá.</div>` : ''}
      <div id="opts"></div>
      <div class="explain" id="explain">${q.e}</div>
      <div class="q-actions">
        ${q.multi ? `<button class="btn secondary" id="confirm-btn" style="margin-right:auto;">Confirmar respuesta</button>` : ''}
        <button class="btn secondary" id="next-btn" style="display:none;">
          ${quizIndex+1 < quizPool.length ? 'Siguiente pregunta' : 'Ver resultado final'}
        </button>
      </div>
    </div>
  `;
  const optsWrap = document.getElementById('opts');
  q.o.forEach((opt, idx)=>{
    const b = document.createElement('button');
    b.className = 'opt-btn' + (q.multi ? ' checkbox' : '');
    b.innerHTML = q.multi ? `<span class="chk"></span><span>${opt}</span>` : opt;
    b.onclick = ()=> q.multi ? toggleMulti(idx, b) : responder(idx);
    optsWrap.appendChild(b);
  });
  quizAnswered = false;
  if(q.multi){
    document.getElementById('confirm-btn').onclick = ()=> confirmarMulti();
  }
}

function toggleMulti(idx, btn){
  if(quizAnswered) return;
  if(quizSelected.has(idx)){ quizSelected.delete(idx); btn.classList.remove('selected'); }
  else { quizSelected.add(idx); btn.classList.add('selected'); }
}

function confirmarMulti(){
  if(quizAnswered) return;
  if(quizSelected.size === 0){ alert('Marcá al menos una opción antes de confirmar.'); return; }
  quizAnswered = true;
  const q = quizPool[quizIndex];
  const correctas = new Set(q.c);
  const botones = document.querySelectorAll('.opt-btn');
  let exacto = true;
  botones.forEach((b,i)=>{
    b.classList.add('locked');
    const marcada = quizSelected.has(i);
    const esCorrecta = correctas.has(i);
    if(esCorrecta && marcada) b.classList.add('correct');
    else if(!esCorrecta && marcada){ b.classList.add('incorrect'); exacto = false; }
    else if(esCorrecta && !marcada){ b.classList.add('missed'); exacto = false; }
  });
  if(exacto) quizScore++;
  quizAnswers.push({ q, elegida: [...quizSelected], acierto: exacto });
  document.getElementById('explain').classList.add('show');
  document.getElementById('confirm-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = 'inline-block';
  document.getElementById('next-btn').onclick = ()=> avanzar();
  actualizarProgreso();
}

function responder(idx){
  if(quizAnswered) return;
  quizAnswered = true;
  const q = quizPool[quizIndex];
  const correcta = q.c;
  const botones = document.querySelectorAll('.opt-btn');
  botones.forEach((b,i)=>{
    b.classList.add('locked');
    if(i === correcta) b.classList.add('correct');
    else if(i === idx) b.classList.add('incorrect');
  });
  const acierto = idx === correcta;
  if(acierto) quizScore++;
  quizAnswers.push({ q, elegida: idx, acierto });
  document.getElementById('explain').classList.add('show');
  document.getElementById('next-btn').style.display = 'inline-block';
  document.getElementById('next-btn').onclick = ()=> avanzar();
  actualizarProgreso();
}

function avanzar(){
  if(quizIndex+1 < quizPool.length){ quizIndex++; renderQuizQuestion(document.getElementById('main')); }
  else { currentView = 'practica-score'; render(); }
}

function actualizarProgreso(){
  document.querySelector('.q-progress').innerHTML = `<span>Pregunta ${quizIndex+1} de ${quizPool.length}</span><span>Puntaje: ${quizScore}/${quizIndex+1}</span>`;
}

// ---------------- PRACTICA: RESULTADO ----------------
function renderQuizScore(main){
  const total = quizPool.length;
  const pct = Math.round((quizScore/total)*100);
  const falladas = quizAnswers.filter(a=>!a.acierto);
  main.innerHTML = `
    <div class="topbar"><h1>Resultado</h1></div>
    <div class="score-screen">
      <div class="score-num">${quizScore}/${total}</div>
      <div class="score-label">${pct}% de aciertos</div>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;">
        <button class="btn" id="retry-btn">Practicar de nuevo</button>
        <button class="btn secondary" id="setup-btn">Cambiar filtros</button>
      </div>
      ${falladas.length > 0 ? `
        <div class="score-detail">
          <h3 style="font-family:var(--font-mono);font-size:14px;color:var(--accent);margin-bottom:8px;">Repasar lo que falló:</h3>
          ${falladas.map(a=>`<div class="score-row"><span>${a.q.p}</span></div>`).join('')}
        </div>
      ` : `<div class="score-detail" style="text-align:center;color:var(--good);">¡Ninguna pregunta fallada!</div>`}
    </div>
  `;
  document.getElementById('retry-btn').onclick = ()=> iniciarQuiz();
  document.getElementById('setup-btn').onclick = ()=> goTo('practica-setup');
}

render();
</script>
</body>
</html>
